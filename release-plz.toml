[workspace]
release_always = false
git_tag_name = "{{ package }}-v{{ version }}"
git_release_enable = true
changelog_update = true
dependencies_update = false
publish_no_verify = false

# The compatibility host tracks the upstream release independently.
[[package]]
name = "soroban-sim-host"
semver_check = false
git_release_latest = false

[[package]]
name = "soroban-sim-core"
version_group = "sim"
git_release_latest = false

[[package]]
name = "soroban-sim-facade"
version_group = "sim"
git_release_latest = false

[[package]]
name = "soroban-sim-cli"
version_group = "sim"
git_release_latest = true

[[package]]
name = "soroban-sim-component"
version_group = "sim"
git_release_latest = false
