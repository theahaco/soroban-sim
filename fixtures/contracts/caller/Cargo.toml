[workspace]

[package]
name = "soroban-sim-fixture-caller"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "soroban_sim_fixture_caller"

[dependencies]
soroban-sdk = "=27.0.5"

[profile.contract]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
