[workspace]
resolver = "2"
members = [
    "crates/soroban-sim-host",
    "crates/soroban-sim-core",
    "crates/soroban-sim-component",
    "crates/soroban-sim-cli",
    "crates/soroban-sim-facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/theahaco/soroban-sim"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.103"
# The versions soroban-env-host already links (no new crypto in the tree).
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10.9"
# Exact crates.io releases corresponding to the protocol currently running on
# Testnet. A browser preflight must execute with the same host protocol as the
# ledger snapshot it resolves; upgrade these together when the network moves.
soroban-env-host = { version = "=29.0.2", default-features = true }
soroban-simulation = { version = "=29.0.2" }
# Separate package identity keeps recording_mode out of transaction application.
# Its source is byte-for-byte upstream 29.0.2; see the compatibility package's
# UPSTREAM.json and docs/releases.md for verification and upgrade instructions.
soroban-env-host-apply = { package = "soroban-sim-host", path = "crates/soroban-sim-host", version = "=29.0.2" }
static_assertions = "1.1.0"
stellar-strkey = "0.0.13"
wit-bindgen = "0.60.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
