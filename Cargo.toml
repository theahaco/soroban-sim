[workspace]
resolver = "2"
members = [
    "crates/soroban-sim-host",
    "crates/soroban-sim-host-p27",
    "crates/soroban-sim-host-p30",
    "crates/soroban-sim-core",
    "crates/soroban-sim-component",
    "crates/soroban-sim-cli",
    "crates/soroban-sim-facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/theahaco/soroban-sim"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.103"
# The versions soroban-env-host already links (no new crypto in the tree).
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10.9"
# Default protocol line for the CLI and browser. Core also exposes host-p27
# and host-p30 features; see docs/host-inspection.md. Fork parity remains strict.
soroban-env-host = { version = "=29.0.2", default-features = true }
soroban-simulation = { version = "=29.0.2" }
# Separate package identity keeps recording_mode out of transaction application.
# The pin is that package's own version. UPSTREAM.json records the upstream
# source and PATCHES.json the inspection additions; see docs/releases.md for verification
# and upgrade instructions.
soroban-env-host-apply = { package = "soroban-sim-host", path = "crates/soroban-sim-host", version = "=29.0.2" }
static_assertions = "1.1.0"
stellar-strkey = "0.0.13"
wit-bindgen = "0.60.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
