name: Release CLI binaries

on:
  push:
    tags: ['soroban-sim-cli-v*']

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'theahaco/soroban-sim'
    uses: ./.github/workflows/build-cli.yml
  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Attach the verified archives to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # release-plz creates the GitHub release immediately after its tag.
          for _ in {1..12}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/* --clobber
