[package]
name = "soroban-sim-cli-p30"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The soroban-sim engine against the protocol-30 Soroban host (a generated copy of soroban-sim-cli's library)"
autobins = false
autoexamples = false
autotests = false
autobenches = false

# The sources are soroban-sim-cli's library (scripts/sync-protocol-twins.py).
# Their unit tests run here against protocol 30; integration tests and
# doctests (which name `soroban_sim_cli`) run in soroban-sim-cli.
[lib]
doctest = false

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2.workspace = true
# The same dependency names as soroban-sim-cli, so the copied sources build
# unchanged against the protocol-30 releases.
soroban-env-host = { version = "=30.0.0", features = ["recording_mode"] }
soroban-sim-core = { package = "soroban-sim-core-p30", path = "../soroban-sim-core-p30", version = "0.1.1" }
soroban-sim-facade = { package = "soroban-sim-facade-p30", path = "../soroban-sim-facade-p30", version = "0.1.1" }
soroban-simulation = "=30.0.0"
stellar-xdr = { version = "=30.0.0", features = ["serde", "base64"] }
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
flate2 = "1"
