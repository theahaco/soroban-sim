[package]
name = "soroban-sim-host"
version = "29.0.2"
edition = "2021"
rust-version = "1.89"
authors = ["Stellar Development Foundation <info@stellar.org>"]
license = "Apache-2.0"
repository = "https://github.com/theahaco/soroban-sim"
description = "Isolated Soroban application host for soroban-sim exact transaction metering"
readme = "README.md"
autobins = false
autotests = false
autobenches = false
include = ["src/**", "build.rs", "README.md", "UPSTREAM-README.md", "UPSTREAM.json", "LICENSE"]

# This compatibility package is validated by soroban-sim's replay tests.
# Upstream's test-only targets/dependencies are not part of its public package.
[lib]
name = "soroban_sim_host"
path = "src/lib.rs"
test = false
doctest = false

[features]
backtrace = ["dep:backtrace"]
bench = ["testutils"]
next = ["soroban-env-common/next"]
recording_mode = []
testutils = [
    "soroban-env-common/testutils",
    "recording_mode",
]
tracy = [
    "dep:tracy-client",
    "soroban-env-common/tracy",
]
unstable-next-api = []

[dependencies.ark-bls12-381]
version = "0.5.0"

[dependencies.ark-bn254]
version = "0.5.0"

[dependencies.ark-ec]
version = "0.5.0"

[dependencies.ark-ff]
version = "0.5.0"

[dependencies.ark-serialize]
version = "0.5.0"

[dependencies.backtrace]
version = "0.3.75"
optional = true

[dependencies.curve25519-dalek]
version = ">=4.1.3"
features = ["digest"]
default-features = false

[dependencies.ecdsa]
version = "0.16.7"
default-features = false

[dependencies.ed25519-dalek]
version = "2.0.0"
features = ["rand_core"]

[dependencies.elliptic-curve]
version = "0.13.5"
default-features = false

[dependencies.generic-array]
version = "0.14.7"

[dependencies.getrandom]
version = "0.2.11"
features = ["js"]

[dependencies.hex-literal]
version = "0.4.1"

[dependencies.hmac]
version = "0.12.1"

[dependencies.k256]
version = "0.13.3"
features = [
    "ecdsa",
    "arithmetic",
]
default-features = false

[dependencies.num-derive]
version = "0.4.1"

[dependencies.num-integer]
version = "0.1.45"

[dependencies.num-traits]
version = "0.2.17"

[dependencies.p256]
version = "0.13.2"
features = [
    "ecdsa",
    "arithmetic",
]
default-features = false

[dependencies.rand]
version = "0.8.5"

[dependencies.rand_chacha]
version = "0.3.1"

[dependencies.sec1]
version = "0.7.2"

[dependencies.sha2]
version = "0.10.8"

[dependencies.sha3]
version = "0.10.8"

[dependencies.soroban-builtin-sdk-macros]
version = "=29.0.2"

[dependencies.soroban-env-common]
version = "=29.0.2"
features = [
    "std",
    "wasmi",
    "shallow-val-hash",
]
default-features = false

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.stellar-strkey]
version = "0.0.13"

[dependencies.wasmi]
version = "=29.0.0"
package = "soroban-wasmi"

[dependencies.wasmparser]
version = "=0.116.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies.tracy-client]
version = "0.17.0"
features = [
    "enable",
    "timer-fallback",
]
optional = true
default-features = false
