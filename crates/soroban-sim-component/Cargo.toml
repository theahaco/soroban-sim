[package]
name = "soroban-sim-component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

description = "WASI component interface for portable Soroban simulation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
serde_json = "1.0"
soroban-env-host = { workspace = true, features = ["recording_mode"] }
# The browser applies session transactions with the recording-mode host it
# already links, so it skips the second, exact-metering host build.
soroban-sim-core = { path = "../soroban-sim-core", version = "0.1.0", default-features = false }
soroban-sim-facade = { path = "../soroban-sim-facade", version = "0.1.0" }
wit-bindgen.workspace = true
