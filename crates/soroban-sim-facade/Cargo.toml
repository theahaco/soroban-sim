[package]
name = "soroban-sim-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A Stellar RPC facade over a network session, without a transport: stellar-rpc and fork_* JSON-RPC methods, the step log and the session report"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
soroban-env-host = { workspace = true, features = ["recording_mode"] }
# Default features off so the browser component can leave out exact apply;
# the CLI turns it on through its own dependency.
soroban-sim-core = { path = "../soroban-sim-core", version = "0.1.0", default-features = false }
soroban-simulation.workspace = true
# The XDR crate soroban-env-host links, with serde for the report's ScVal
# JSON and base64 for RPC's XDR strings.
stellar-xdr = { version = "=28.0.0", features = ["serde", "base64"] }
