[package]
name = "soroban-sim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Rehearse a multi-transaction Soroban setup on a forked network"

[[bin]]
name = "soroban-sim"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2.workspace = true
soroban-env-host = { workspace = true, features = ["recording_mode"] }
soroban-sim-core = { path = "../soroban-sim-core", version = "0.1.0" }
soroban-sim-facade = { path = "../soroban-sim-facade", version = "0.1.0" }
soroban-simulation.workspace = true
# The XDR crate soroban-env-host links, with serde for plan-file ScVal JSON.
stellar-xdr = { version = "=28.0.0", features = ["serde", "base64"] }
# The RPC facade (`soroban-sim serve`): a small blocking HTTP/1.1 server, so
# the session stays on one thread.
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
flate2 = "1"
